name: Collect AI news candidates

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect official-source candidates
        run: node scripts/collect-news.mjs
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-candidates-${{ github.run_number }}
          path: data/candidates.json
          retention-days: 14
